<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <title>DOMARGO - Camera Monitor</title>
    <style>
      :root {
        --bg-body: #0a0a0a;
        --bg-header: #111111;
        --bg-card: linear-gradient(145deg, #1a1a1a, #0f0f0f);
        --bg-object: linear-gradient(90deg, #1a1a1a, #0f0f0f);
        --text-primary: #ffffff;
        --text-secondary: #e0e0e0;
        --text-muted: #888888;
        --text-dim: #666666;
        --border-default: #2a2a2a;
        --border-header: #333333;
        --border-accent: #444444;
        --status-online: #2ecc71;
        --status-online-bg: rgba(46, 204, 113, 0.15);
        --status-online-border: rgba(46, 204, 113, 0.3);
        --status-offline: #e74c3c;
        --status-offline-bg: rgba(231, 76, 60, 0.15);
        --status-offline-border: rgba(231, 76, 60, 0.3);
        --font-base: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --space-xs: 8px;
        --space-sm: 12px;
        --space-md: 16px;
        --space-lg: 20px;
        --space-xl: 24px;
        --space-2xl: 32px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--font-base);
        background-color: var(--bg-body);
        color: var(--text-secondary);
        line-height: 1.5;
        font-weight: 300;
      }

      /* LOGIN */
      .login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s,
          visibility 0.2s;
      }
      .login-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      .login-card {
        background: #1a1a1a;
        padding: 32px;
        border: 1px solid #333;
        border-radius: 0;
        width: 100%;
        max-width: 400px;
      }
      .login-card h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #fff;
        font-weight: 400;
        letter-spacing: 1px;
      }
      .input-group {
        margin-bottom: 16px;
      }
      .input-group label {
        display: block;
        margin-bottom: 6px;
        color: #888;
        font-size: 0.9em;
      }
      .input-group input {
        width: 100%;
        padding: 10px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        border-radius: 0;
        font-size: 1em;
      }
      .input-group input:focus {
        outline: none;
        border-color: #fff;
      }
      #login-btn {
        width: 100%;
        padding: 10px;
        background: #222;
        color: #fff;
        border: 1px solid #fff;
        border-radius: 0;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
      }
      #login-btn:hover {
        background: #333;
      }
      #login-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .error-msg {
        color: #e74c3c;
        text-align: center;
        margin-top: 12px;
        font-size: 0.9em;
        min-height: 18px;
      }

      /* HEADER */
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: var(--space-md);
        background: var(--bg-header);
        padding: var(--space-md);
        border-bottom: 1px solid var(--border-header);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-left {
        display: flex;
        justify-content: flex-start;
      }

      .header-center {
        display: flex;
        justify-content: center;let streamAbortController = null;
      }

      .header-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
      }

      #header-logo {
        height: 40px;
        width: auto;
      }

      h1 {
        font-weight: 300;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-primary);
        font-size: 1.4em;
        margin: 0;
      }

      #current-time {
        color: var(--text-muted);
        font-size: 0.95em;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      @media (max-width: 768px) {
        header {
          grid-template-columns: 1fr;
          gap: var(--space-sm);
          text-align: center;
        }

        .header-left,
        .header-center,
        .header-right {
          justify-content: center;
        }

        .header-right {
          align-items: center;
        }
      }

      /* STATS */
      .global-stats {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--space-lg);
        background: var(--bg-object);
        padding: var(--space-sm) var(--space-md);
        border-bottom: 1px solid var(--border-header);
      }
      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .stat-value {
        font-size: 1.3em;
        font-weight: 500;
        color: var(--text-primary);
      }
      .stat-label {
        font-size: 0.75em;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #total-online {
        color: var(--status-online);
      }
      #total-offline {
        color: var(--status-offline);
      }
      .stat-divider {
        width: 1px;
        height: 20px;
        background: var(--border-accent);
      }

      /* GRID & CARDS */
      .objects-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: var(--space-xl) var(--space-md) var(--space-2xl);
      }
      .object-section {
        margin-top: 1rem;
      }
      .object-header {
        background: var(--bg-object);
        padding: var(--space-sm) var(--space-lg);
        margin-bottom: var(--space-md);
        border-left: 3px solid var(--border-accent);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-xs);
      }
      .object-name {
        font-size: 1.1em;
        font-weight: 400;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--text-primary);
      }
      .object-stats {
        font-size: 0.85em;
        color: var(--text-dim);
        display: flex;
        gap: var(--space-md);
      }
      .stat-online {
        color: var(--status-online);
      }
      .stat-offline {
        color: var(--status-offline);
      }

      .cameras-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-md);
      }
      .camera-card {
        background: var(--bg-card);
        padding: var(--space-md);
        border: 1px solid var(--border-default);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 120px;
        cursor: pointer;
        border-radius: 0;
      }
      .camera-card:hover {
        border-color: var(--border-accent);
      }
      .camera-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--border-accent);
      }
      .status-online::before {
        background: var(--status-online);
      }
      .status-offline::before {
        background: var(--status-offline);
      }
      .camera-name {
        font-size: 1.05em;
        font-weight: 400;
        margin-bottom: var(--space-xs);
        color: var(--text-primary);
      }
      .camera-info {
        color: var(--text-muted);
        font-size: 0.85em;
        margin-bottom: 4px;
      }
      .status-indicator {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 0;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: auto;
        font-weight: 500;
        align-self: flex-start;
      }
      .status-online .status-indicator {
        background: var(--status-online-bg);
        color: var(--status-online);
        border: 1px solid var(--status-online-border);
      }
      .status-offline .status-indicator {
        background: var(--status-offline-bg);
        color: var(--status-offline);
        border: 1px solid var(--status-offline-border);
      }
      .loading {
        text-align: center;
        padding: var(--space-2xl);
        color: var(--text-dim);
      }

      /* MODALS */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s,
          visibility 0.2s;
      }
      .modal.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        background: #111;
        border: 1px solid #333;
        border-radius: 0;
        width: 90%;
        max-width: 1200px;
        height: 85vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal-header {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid #333;
        background: #1a1a1a;
      }
      .modal-header h2 {
        font-size: 1.1em;
        font-weight: 400;
        color: #fff;
        margin: 0;
      }
      .modal-body {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding: 20px;
      }
      .btn-close {
        background: transparent;
        border: none;
        color: #888;
        font-size: 1.8em;
        cursor: pointer;
        line-height: 1;
        padding: 0 4px;
      }
      .btn-close:hover {
        color: #fff;
      }

      /* VIDEO PLAYER */
      .video-container {
        flex-grow: 1;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        min-height: 300px;
      }
      #stream-image {
        max-width: 100%;
        max-height: 80vh;
        display: none;
      }
      #stream-image.active {
        display: block;
      }
      .loading-indicator {
        color: #666;
        font-size: 1em;
        position: absolute;
      }
      .mode-btn {
        background: #333;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 0;
        cursor: pointer;
        font-size: 0.85em;
        font-weight: 500;
      }
      .mode-btn.active {
        background: #2ecc71 !important;
        color: #000 !important;
      }

      /* ADMIN PANEL */
      .admin-actions {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .btn-action {
        border: none;
        padding: 10px 20px;
        border-radius: 0;
        cursor: pointer;
        font-size: 0.95em;
        font-weight: 500;
      }
      .btn-add {
        background: #2ecc71;
        color: #000;
      }
      .btn-reload {
        background: #3498db;
        color: #fff;
      }
      .btn-edit {
        background: #3498db;
        color: #fff;
        padding: 5px 12px;
        font-size: 0.85em;
        margin-right: 6px;
      }
      .btn-toggle {
        background: #e74c3c;
        color: #fff;
        padding: 5px 12px;
        font-size: 0.85em;
        margin-right: 6px;
      }
      .btn-toggle.on {
        background: #2ecc71;
      }
      .btn-delete {
        background: #e74c3c;
        color: #fff;
        padding: 5px 12px;
        font-size: 0.85em;
      }

      .table-wrapper {
        width: 100%;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
        min-width: 800px;
      }
      th {
        text-align: left;
        padding: 12px;
        border-bottom: 2px solid #444;
        color: #aaa;
        font-weight: 500;
        white-space: nowrap;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid #222;
        color: #ddd;
      }
      tr:hover td {
        background: #1a1a1a;
      }

      /* FORM */
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #888;
        font-size: 0.9em;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 9px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        border-radius: 0;
        font-size: 0.95em;
      }
      .form-group input:focus {
        outline: none;
        border-color: #fff;
      }
      .btn-submit {
        width: 100%;
        padding: 10px;
        background: #2ecc71;
        color: #000;
        border: none;
        border-radius: 0;
        font-size: 0.95em;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn-submit:hover {
        background: #27ae60;
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        header {
          flex-direction: column;
          gap: var(--space-sm);
        }
        .object-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .cameras-grid {
          grid-template-columns: 1fr;
        }
        .modal-content {
          width: 95%;
          height: 90vh;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div id="login-overlay" class="login-overlay">
      <div class="login-card">
        <h2>Вход в систему</h2>
        <form id="login-form">
          <div class="input-group">
            <label>Логин</label>
            <input type="text" id="username" required autocomplete="username" />
          </div>
          <div class="input-group">
            <label>Пароль</label>
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" id="login-btn">Войти</button>
          <p id="login-error" class="error-msg"></p>
        </form>
      </div>
    </div>

    <!-- HEADER -->
    <header>
      <div class="header-left">
        <img
          id="header-logo"
          src="/static/assets/img/logo_white.png"
          alt="Logo"
        />
      </div>

      <div class="header-center">
        <h1 id="header-title">Мониторинг Камер</h1>
      </div>

      <div class="header-right">
        <div id="current-time"></div>
        <div>
          <button
            id="admin-panel-btn"
            onclick="openAdminPanel()"
            style="
              background: #9b59b6;
              color: #fff;
              border: none;
              padding: 6px 12px;
              border-radius: 0;
              cursor: pointer;
              font-size: 0.9em;
              display: none;
            "
          >
            Админ-панель
          </button>
          <button
            id="logout-btn"
            style="
              background: #e74c3c;
              color: #fff;
              border: none;
              padding: 6px 12px;
              border-radius: 0;
              cursor: pointer;
              font-size: 0.9em;
            "
          >
            Выйти
          </button>
        </div>
      </div>
    </header>

    <!-- STATS -->
    <div id="global-stats" class="global-stats">
      <div class="stat-item">
        <span class="stat-value" id="total-online">0</span
        ><span class="stat-label">Онлайн</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="total-offline">0</span
        ><span class="stat-label">Офлайн</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="total-cameras">0</span
        ><span class="stat-label">Всего</span>
      </div>
    </div>

    <!-- GRID -->
    <div id="objects-container" class="objects-container">
      <div class="loading">Загрузка камер...</div>
    </div>

    <!-- VIDEO MODAL -->
    <div id="video-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-camera-name">Камера</h2>
          <div style="display: flex; gap: 8px; align-items: center">
            <button id="mode-snapshot" class="mode-btn active">Снимки</button>
            <button id="mode-stream" class="mode-btn">Поток</button>
            <button id="modal-close" class="btn-close">&times;</button>
          </div>
        </div>
        <div class="video-container">
          <div id="video-loading" class="loading-indicator">Подключение...</div>
          <img id="stream-image" src="" alt="Stream" />
        </div>
      </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Управление камерами</h2>
          <button id="admin-modal-close" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <!-- Tabs -->
          <div
            style="
              display: flex;
              gap: 4px;
              margin-bottom: 16px;
              border-bottom: 1px solid #333;
              padding-bottom: 8px;
            "
          >
            <button
              id="tab-cameras"
              class="mode-btn active"
              onclick="switchAdminTab('cameras')"
              style="padding: 8px 16px"
            >
              Камеры
            </button>
            <button
              id="tab-stats"
              class="mode-btn"
              onclick="switchAdminTab('stats')"
              style="padding: 8px 16px"
            >
              Статистика
            </button>
          </div>

          <!-- Cameras Tab -->
          <div id="admin-tab-cameras">
            <div class="admin-actions">
              <button id="add-camera-btn" class="btn-action btn-add">
                Добавить камеру
              </button>
              <button id="reload-config-btn" class="btn-action btn-reload">
                Перезагрузить конфиг
              </button>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Объект</th>
                    <th>Расположение</th>
                    <th>Статус</th>
                    <th>Действия</th>
                  </tr>
                </thead>
                <tbody id="admin-camera-list">
                  <tr>
                    <td
                      colspan="6"
                      style="text-align: center; padding: 20px; color: #666"
                    >
                      Загрузка...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Stats Tab -->
          <div id="admin-tab-stats" style="display: none">
            <div
              style="
                margin-bottom: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <select
                id="stats-period"
                onchange="loadStatsSummary()"
                style="
                  background: #0a0a0a;
                  border: 1px solid #333;
                  color: #fff;
                  padding: 8px 12px;
                  font-size: 0.95em;
                "
              >
                <option value="1">24 часа</option>
                <option value="7" selected>7 дней</option>
                <option value="30">30 дней</option>
                <option value="90">3 месяца</option>
                <option value="180">6 месяцев</option>
                <option value="365">1 год</option>
              </select>
              <button
                onclick="exportReport()"
                style="
                  background: #27ae60;
                  color: #fff;
                  border: none;
                  padding: 8px 16px;
                  cursor: pointer;
                  font-size: 0.95em;
                "
              >
                Скачать Excel
              </button>
            </div>
            <div
              id="stats-container"
              style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 16px;
              "
            >
              <div
                style="
                  grid-column: 1/-1;
                  text-align: center;
                  padding: 40px;
                  color: #666;
                "
              >
                Загрузка...
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FORM MODAL -->
    <div id="camera-form-modal" class="modal">
      <div class="modal-content" style="max-width: 600px">
        <div class="modal-header">
          <h2 id="camera-form-title">Добавить камеру</h2>
          <button id="camera-form-close" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="camera-form">
            <input type="hidden" id="cam-id" />
            <div class="form-group">
              <label>ID камеры *</label>
              <input type="number" id="cam-id-input" required />
            </div>
            <div class="form-group">
              <label>Название *</label>
              <input type="text" id="cam-name" required />
            </div>
            <div class="form-group">
              <label>Объект</label>
              <input type="text" id="cam-object" />
            </div>
            <div class="form-group">
              <label>Расположение</label>
              <input type="text" id="cam-location" />
            </div>
            <div class="form-group">
              <label>Тип</label>
              <input type="text" id="cam-type" />
            </div>
            <div class="form-group">
              <label>RTSP URL *</label>
              <input
                type="text"
                id="cam-url"
                required
                placeholder="rtsp://user:pass@ip:554/stream"
              />
            </div>
            <div
              class="form-group"
              style="display: flex; align-items: center; gap: 10px"
            >
              <input
                type="checkbox"
                id="cam-enabled"
                checked
                style="width: 16px; height: 16px"
              />
              <label style="margin: 0; cursor: pointer">Камера включена</label>
            </div>
            <button type="submit" class="btn-submit">Сохранить</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      let currentUsername = null;
      let currentCamId = null;
      let currentMode = "snapshot";
      let snapshotInterval = null;
      let loadingTimeout = null;
      let streamAbortController = null;
      const STREAM_TIMEOUT_MS = 15000;

      const loginOverlay = document.getElementById("login-overlay");
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const globalStats = document.getElementById("global-stats");
      const objectsContainer = document.getElementById("objects-container");
      const logoutBtn = document.getElementById("logout-btn");
      const adminPanelBtn = document.getElementById("admin-panel-btn");
      const adminModal = document.getElementById("admin-modal");
      const cameraFormModal = document.getElementById("camera-form-modal");
      const adminCameraList = document.getElementById("admin-camera-list");
      const modal = document.getElementById("video-modal");
      const modalImage = document.getElementById("stream-image");
      const modalName = document.getElementById("modal-camera-name");
      const loadingIndicator = document.getElementById("video-loading");

      function updateDateTime() {
        const now = new Date();
        const months = [
          "января",
          "февраля",
          "марта",
          "апреля",
          "мая",
          "июня",
          "июля",
          "августа",
          "сентября",
          "октября",
          "ноября",
          "декабря",
        ];
        document.getElementById("current-time").textContent =
          `${now.getDate()} ${months[now.getMonth()]} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      }
      updateDateTime();
      setInterval(updateDateTime, 60000);

      function showLoginScreen() {
        loginOverlay.classList.add("active");
        if (globalStats) globalStats.style.display = "none";
        if (objectsContainer) objectsContainer.style.display = "none";
        if (logoutBtn) logoutBtn.style.display = "none";
        if (adminPanelBtn) adminPanelBtn.style.display = "none";
      }
      function hideLoginScreen() {
        loginOverlay.classList.remove("active");
        if (globalStats) globalStats.style.display = "flex";
        if (objectsContainer) objectsContainer.style.display = "block";
        if (logoutBtn) logoutBtn.style.display = "inline-block";
        checkAdminAccess();
      }
      function checkAdminAccess() {
        if (adminPanelBtn)
          adminPanelBtn.style.display =
            currentUsername === "pepethefrog" ? "inline-block" : "none";
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const btn = document.getElementById("login-btn");
        btn.disabled = true;
        btn.textContent = "Проверка...";
        loginError.textContent = "";
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": "XMLHttpRequest",
            },
            body: JSON.stringify({ username: user, password: pass }),
          });
          if (res.ok) {
            const data = await res.json();
            currentUsername = data.username;
            await loadCameras();
            hideLoginScreen();
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
          } else {
            const err = await res.json();
            loginError.textContent = err.detail || "Ошибка входа";
          }
        } catch (err) {
          loginError.textContent = "Ошибка соединения";
        } finally {
          btn.disabled = false;
          btn.textContent = "Войти";
        }
      });

      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            const res = await fetch("/api/logout", {
              method: "GET",
              headers: { "X-Requested-With": "XMLHttpRequest" },
            });
            if (res.ok) {
              currentUsername = null;
              showLoginScreen();
              objectsContainer.innerHTML =
                '<div class="loading">Загрузка камер...</div>';
              document.getElementById("total-online").textContent = "0";
              document.getElementById("total-offline").textContent = "0";
              document.getElementById("total-cameras").textContent = "0";
            }
          } catch (err) {
            console.error(err);
          }
        });
      }

      async function loadCameras() {
        try {
          const res = await fetch("/api/cameras", {
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (res.status === 401) {
            showLoginScreen();
            return;
          }
          if (!res.ok) throw new Error("Network error");
          const cameras = await res.json();
          hideLoginScreen();
          renderGroupedCameras(cameras);
        } catch (err) {
          objectsContainer.innerHTML =
            '<div class="loading" style="color:#e74c3c">Ошибка загрузки данных</div>';
        }
      }

      function renderGroupedCameras(cameras) {
        const total = cameras.length;
        const online = cameras.filter((c) => c.status === "online").length;
        document.getElementById("total-online").textContent = online;
        document.getElementById("total-offline").textContent = total - online;
        document.getElementById("total-cameras").textContent = total;

        const grouped = cameras.reduce((acc, cam) => {
          const obj = cam.object || "Не назначен";
          if (!acc[obj]) acc[obj] = [];
          acc[obj].push(cam);
          return acc;
        }, {});

        objectsContainer.innerHTML = "";
        Object.keys(grouped).forEach((obj) => {
          const cams = grouped[obj];
          const onCount = cams.filter((c) => c.status === "online").length;
          const sec = document.createElement("div");
          sec.className = "object-section";
          sec.innerHTML = `
          <div class="object-header">
            <div class="object-name">${escapeHtml(obj)}</div>
            <div class="object-stats">
              <span class="stat-online">${onCount} работает</span>
              <span class="stat-offline">${cams.length - onCount} отключено</span>
              <span>${cams.length} всего</span>
            </div>
          </div>
          <div class="cameras-grid"></div>
        `;
          objectsContainer.appendChild(sec);
          const grid = sec.querySelector(".cameras-grid");
          cams.forEach((cam) => {
            const card = document.createElement("div");
            card.className = `camera-card ${cam.status === "online" ? "status-online" : "status-offline"}`;
            card.dataset.cameraId = cam.id;
            card.innerHTML = `
            <div class="camera-name">${escapeHtml(cam.name)}</div>
            ${cam.location ? `<div class="camera-info">${escapeHtml(cam.location)}</div>` : ""}
            <div class="camera-info">IP: ${escapeHtml(cam.ip)}</div>
            <div class="status-indicator">${cam.status === "online" ? "Работает" : "Отключена"}</div>
          `;
            grid.appendChild(card);
          });
        });
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, (m) =>
          m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
        );
      }

      objectsContainer.addEventListener("click", (e) => {
        const card = e.target.closest(".camera-card");
        if (card)
          openCameraStream(
            card.dataset.cameraId,
            card.querySelector(".camera-name").textContent,
          );
      });

      function switchMode(mode) {
        currentMode = mode;
        document
          .getElementById("mode-snapshot")
          .classList.toggle("active", mode === "snapshot");
        document
          .getElementById("mode-stream")
          .classList.toggle("active", mode === "stream");

        if (streamAbortController) {
          streamAbortController.abort();
          streamAbortController = null;
        }
        if (snapshotInterval) {
          clearInterval(snapshotInterval);
          snapshotInterval = null;
        }
        modalImage.src = "";
        modalImage.classList.remove("active");
        loadingIndicator.style.color = "#666";
        loadingIndicator.style.display = "block";
        if (!currentCamId) return;

        if (mode === "snapshot") {
          loadingIndicator.textContent = "Загрузка снимка...";
          loadSnapshot();
        } else {
          loadingIndicator.textContent = "Подключение к потоку...";
          startMjpegStream(currentCamId);
        }
      }

      async function startMjpegStream(cameraId) {
        streamAbortController = new AbortController();
        try {
          const res = await fetch(`/api/stream/${cameraId}?t=${Date.now()}`, {
            signal: streamAbortController.signal,
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (!res.ok) throw new Error("error");
          const reader = res.body.getReader();
          let buffer = new Uint8Array(0);
          loadingIndicator.style.display = "none";
          modalImage.classList.add("active");
          while (true) {
            const { done, value } = await reader.read();
            if (done || streamAbortController.signal.aborted) break;
            const tmp = new Uint8Array(buffer.length + value.length);
            tmp.set(buffer);
            tmp.set(value, buffer.length);
            buffer = tmp;
            let s = -1,
              e = -1;
            for (let i = 0; i < buffer.length - 1; i++) {
              if (buffer[i] === 0xff && buffer[i + 1] === 0xd8) s = i;
              if (buffer[i] === 0xff && buffer[i + 1] === 0xd9 && s !== -1) {
                e = i + 2;
                break;
              }
            }
            if (s !== -1 && e !== -1) {
              const blob = new Blob([buffer.slice(s, e)], {
                type: "image/jpeg",
              });
              const old = modalImage.src;
              modalImage.src = URL.createObjectURL(blob);
              if (old.startsWith("blob:")) URL.revokeObjectURL(old);
              buffer = buffer.slice(e);
            }
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            loadingIndicator.textContent = "Видео недоступно";
            loadingIndicator.style.color = "#e74c3c";
            loadingIndicator.style.display = "block";
            modalImage.classList.remove("active");
          }
        }
      }

      function loadSnapshot() {
        if (!currentCamId) return;
        modalImage.src = `/api/snapshot/${currentCamId}?t=${Date.now()}`;
      }

      function openCameraStream(id, name) {
        currentCamId = id;
        modalName.textContent = name;
        modal.classList.add("active");

        const img = document.getElementById("stream-image");
        const loading = document.getElementById("video-loading");

        img.classList.remove("active");
        loading.style.display = "block";
        loading.textContent = "Загрузка снимка...";
        loading.style.color = "#666";

        // Один запрос при открытии. Больше никакого setInterval.
        img.src = `/api/snapshot/${id}?t=${Date.now()}`;
      }

      modalImage.onload = () => {
        if (loadingTimeout) clearTimeout(loadingTimeout);
        loadingIndicator.style.display = "none";
        modalImage.classList.add("active");
      };

      function closeVideoModal() {
        if (streamAbortController) {
          streamAbortController.abort();
          streamAbortController = null;
        }
        modal.classList.remove("active");
        const img = document.getElementById("stream-image");
        img.src = "";
        img.classList.remove("active");
        document.getElementById("video-loading").style.display = "none";
        currentCamId = null;
      }

      document
        .getElementById("modal-close")
        .addEventListener("click", closeVideoModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeVideoModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("active"))
          closeVideoModal();
      });
      document
        .getElementById("mode-snapshot")
        .addEventListener("click", () => switchMode("snapshot"));
      document
        .getElementById("mode-stream")
        .addEventListener("click", () => switchMode("stream"));

      async function openAdminPanel() {
        adminModal.classList.add("active");
        await loadAdminCameras();
      }

      async function loadAdminCameras() {
        try {
          const res = await fetch("/api/admin/cameras", {
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (!res.ok) {
            adminCameraList.innerHTML =
              '<tr><td colspan="6" style="text-align:center;padding:20px;color:#e74c3c">Ошибка доступа</td></tr>';
            return;
          }
          const cameras = await res.json();
          if (!cameras.length) {
            adminCameraList.innerHTML =
              '<tr><td colspan="6" style="text-align:center;padding:20px;color:#666">Нет камер</td></tr>';
            return;
          }
          let html = "";
          cameras.forEach((cam) => {
            html += `
            <tr>
              <td>${cam.id}</td>
              <td>${cam.name || "-"}</td>
              <td>${cam.object || "-"}</td>
              <td>${cam.location || "-"}</td>
              <td style="color: ${cam.enabled ? "#2ecc71" : "#e74c3c"}; font-weight: 500;">${cam.enabled ? "Вкл" : "Выкл"}</td>
              <td>
                <button onclick="editCamera(${cam.id})" class="btn-edit">Изменить</button>
                <button onclick="toggleCamera(${cam.id})" class="btn-toggle ${cam.enabled ? "" : "on"}">${cam.enabled ? "Выкл" : "Вкл"}</button>
                <button onclick="deleteCamera(${cam.id})" class="btn-delete">Удалить</button>
              </td>
            </tr>
          `;
          });
          adminCameraList.innerHTML = html;
        } catch (err) {
          adminCameraList.innerHTML =
            '<tr><td colspan="6" style="text-align:center;padding:20px;color:#e74c3c">Ошибка загрузки</td></tr>';
        }
      }

      async function editCamera(id) {
        try {
          const res = await fetch("/api/admin/cameras", {
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          const cameras = await res.json();
          const cam = cameras.find((c) => c.id === id);
          if (!cam) return;
          document.getElementById("camera-form-title").textContent =
            "Редактировать камеру";
          document.getElementById("cam-id").value = cam.id;
          document.getElementById("cam-id-input").value = cam.id;
          document.getElementById("cam-id-input").disabled = true;
          document.getElementById("cam-name").value = cam.name || "";
          document.getElementById("cam-object").value = cam.object || "";
          document.getElementById("cam-location").value = cam.location || "";
          document.getElementById("cam-type").value = cam.type || "";
          document.getElementById("cam-url").value = cam.url || "";
          document.getElementById("cam-enabled").checked =
            cam.enabled !== false;
          cameraFormModal.classList.add("active");
        } catch (err) {
          alert("Ошибка загрузки данных");
        }
      }

      async function toggleCamera(id) {
        if (!confirm("Переключить статус?")) return;
        try {
          const res = await fetch(`/api/admin/cameras/${id}/toggle`, {
            method: "POST",
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (res.ok) await loadAdminCameras();
          else alert("Ошибка");
        } catch (err) {
          alert("Ошибка");
        }
      }

      async function deleteCamera(id) {
        if (!confirm("Удалить камеру? Действие необратимо.")) return;
        try {
          const res = await fetch(`/api/admin/cameras/${id}`, {
            method: "DELETE",
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (res.ok) await loadAdminCameras();
          else alert("Ошибка");
        } catch (err) {
          alert("Ошибка");
        }
      }

      document
        .getElementById("camera-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const id =
            parseInt(document.getElementById("cam-id").value) ||
            parseInt(document.getElementById("cam-id-input").value);
          const isEdit = document.getElementById("cam-id").value !== "";
          const data = {
            id,
            name: document.getElementById("cam-name").value,
            object: document.getElementById("cam-object").value,
            location: document.getElementById("cam-location").value,
            type: document.getElementById("cam-type").value,
            url: document.getElementById("cam-url").value,
            enabled: document.getElementById("cam-enabled").checked,
          };
          try {
            const res = await fetch(
              isEdit ? `/api/admin/cameras/${id}` : "/api/admin/cameras",
              {
                method: isEdit ? "PUT" : "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Requested-With": "XMLHttpRequest",
                },
                body: JSON.stringify(data),
              },
            );
            if (res.ok) {
              cameraFormModal.classList.remove("active");
              await loadAdminCameras();
              alert("Сохранено");
            } else {
              const err = await res.json();
              alert(`Ошибка: ${err.detail || "Неизвестно"}`);
            }
          } catch (err) {
            alert("Ошибка сохранения");
          }
        });

      document
        .getElementById("reload-config-btn")
        .addEventListener("click", async () => {
          if (!confirm("Перезагрузить конфиг?")) return;
          try {
            const res = await fetch("/api/admin/reload", {
              method: "POST",
              headers: { "X-Requested-With": "XMLHttpRequest" },
            });
            if (res.ok) {
              alert("Конфиг перезагружен");
              await loadAdminCameras();
              await loadCameras();
            } else alert("Ошибка");
          } catch (err) {
            alert("Ошибка");
          }
        });

      document
        .getElementById("admin-modal-close")
        .addEventListener("click", () => adminModal.classList.remove("active"));
      document
        .getElementById("camera-form-close")
        .addEventListener("click", () =>
          cameraFormModal.classList.remove("active"),
        );
      document
        .getElementById("add-camera-btn")
        .addEventListener("click", () => {
          document.getElementById("camera-form-title").textContent =
            "Добавить камеру";
          document.getElementById("camera-form").reset();
          document.getElementById("cam-id").value = "";
          document.getElementById("cam-id-input").disabled = false;
          cameraFormModal.classList.add("active");
        });

      loadCameras();
      setInterval(loadCameras, 5000);

      // =============================================================================
      // ADMIN TABS & STATS
      // =============================================================================
      function switchAdminTab(tab) {
        document
          .getElementById("tab-cameras")
          .classList.toggle("active", tab === "cameras");
        document
          .getElementById("tab-stats")
          .classList.toggle("active", tab === "stats");
        document.getElementById("admin-tab-cameras").style.display =
          tab === "cameras" ? "block" : "none";
        document.getElementById("admin-tab-stats").style.display =
          tab === "stats" ? "block" : "none";

        if (tab === "stats") loadStatsSummary();
      }

      async function loadStatsSummary() {
        const period = document.getElementById("stats-period").value;
        const container = document.getElementById("stats-container");
        container.innerHTML =
          '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">Загрузка...</div>';

        try {
          const res = await fetch(`/api/admin/stats/summary?days=${period}`, {
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (!res.ok) throw new Error("Failed");

          const data = await res.json();
          if (!data.length) {
            container.innerHTML =
              '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">Нет данных</div>';
            return;
          }

          container.innerHTML = "";
          data.forEach((cam) => {
            const uptime = cam.uptime_percent;
            const color =
              uptime >= 95 ? "#2ecc71" : uptime >= 80 ? "#f39c12" : "#e74c3c";
            const barColor =
              uptime >= 95
                ? "linear-gradient(90deg, #2ecc71, #27ae60)"
                : uptime >= 80
                  ? "linear-gradient(90deg, #f39c12, #e67e22)"
                  : "linear-gradient(90deg, #e74c3c, #c0392b)";

            const card = document.createElement("div");
            card.style.cssText = `
              background: #1a1a1a; border: 1px solid #333; padding: 20px;
            `;

            card.innerHTML = `
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <strong style="font-size:1.1em;color:#fff">Камера #${cam.camera_id}</strong>
                <span style="color:${color};font-weight:600;font-size:1.2em">${uptime}%</span>
              </div>
              
              <div style="background:#222;height:32px;border-radius:0;overflow:hidden;margin-bottom:16px;position:relative">
                <div style="
                  width:${uptime}%;height:100%;
                  background:${barColor};
                  transition:width 0.6s ease;
                "></div>
                <div style="
                  position:absolute;top:0;left:0;right:0;bottom:0;
                  display:flex;align-items:center;justify-content:center;
                  color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.8);
                ">${uptime}% онлайн</div>
              </div>
              
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
                <div style="background:#222;padding:12px;text-align:center">
                  <div style="color:#2ecc71;font-size:1.3em;font-weight:600">${cam.online_seconds}ч</div>
                  <div style="color:#666;font-size:0.85em">Онлайн</div>
                </div>
                <div style="background:#222;padding:12px;text-align:center">
                  <div style="color:#e74c3c;font-size:1.3em;font-weight:600">${cam.offline_seconds}ч</div>
                  <div style="color:#666;font-size:0.85em">Офлайн</div>
                </div>
              </div>
              
              <div style="text-align:center;color:#666;font-size:0.9em">
                Всего смен статуса: <span style="color:#3498db;font-weight:600">${cam.total_changes}</span>
              </div>
            `;

            container.appendChild(card);
          });
        } catch (err) {
          console.error(err);
          container.innerHTML =
            '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#e74c3c">Ошибка</div>';
        }
      }

      function renderUptimeChart(canvasId, uptimePercent) {
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;

        const offlinePercent = 100 - uptimePercent;
        const color =
          uptimePercent >= 95
            ? "#2ecc71"
            : uptimePercent >= 80
              ? "#f39c12"
              : "#e74c3c";

        new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["Онлайн", "Офлайн"],
            datasets: [
              {
                data: [uptimePercent, offlinePercent],
                backgroundColor: [color, "#333"],
                borderWidth: 0,
                cutout: "75%",
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { enabled: true },
            },
            animation: { animateScale: true, animateRotate: true },
          },
        });
      }
      async function exportReport() {
        const days = document.getElementById("stats-period").value;
        try {
          const res = await fetch(`/api/admin/export/stats?days=${days}`, {
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          if (!res.ok) {
            alert("Ошибка при скачивании отчёта");
            return;
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `report_${days}d.xlsx`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          alert("Ошибка соединения");
        }
      }
    </script>
  </body>
</html>
