services:
  app:
    build: .
    container_name: camera-monitor
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cameras.enc:/app/cameras.enc:ro
      - ./secret.key:/app/secret.key:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
      - COOKIE_SECURE=true
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:alpine
    container_name: camera-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
