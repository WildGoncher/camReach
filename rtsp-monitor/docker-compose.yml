services:
  app:
    build: .
    container_name: camera-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"  # Прямой доступ для отладки (можно убрать позже)
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cameras.enc:/app/cameras.enc:ro
      - ./secret.key:/app/secret.key:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
      - COOKIE_SECURE=false  # ПОКА FALSE, потом поменяем на true
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75

  nginx:
    image: nginx:alpine
    container_name: camera-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/pepethefrog.bbship.ru/fullchain.pem:/etc/nginx/ssl/localhost.crt:ro
      - /etc/letsencrypt/live/pepethefrog.bbship.ru/privkey.pem:/etc/nginx/ssl/localhost.key:ro
    depends_on:
      - app
